<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>POPPAD CAFÉ • Staff Orders</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #090909;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 30px;
    }

    .sub {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 22px;
    }

    button {
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    #refresh {
      padding: 14px 20px;
      margin-bottom: 18px;
    }

    .order {
      background: #171717;
      border: 1px solid #555;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .number {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .customer {
      font-size: 26px;
      margin-bottom: 18px;
    }

    .item {
      border-top: 1px solid #444;
      padding: 14px 0;
      font-size: 20px;
    }

    .options {
      color: #ccc;
      font-size: 17px;
      margin-top: 4px;
    }

    .total {
      font-size: 30px;
      font-weight: 900;
      margin: 18px 0;
    }

    .complete {
      width: 100%;
      padding: 20px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #000;
      font-size: 20px;
    }

    #status {
      color: #ccc;
      margin: 10px 0 20px;
    }
  </style>

  <script src="config.js"></script>
</head>

<body>

  <h1>POPPAD CAFÉ • ORDERS</h1>
  <div class="sub">Auto-refreshing every 5 seconds</div>

  <button id="refresh" onclick="loadOrders()">REFRESH</button>

  <div id="status"></div>
  <div id="orders"></div>

  <script>
    const API = (window.POPPAD_ORDER_CONFIG || {}).orderApiUrl;

    const esc = s => String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    async function loadOrders() {
      const ordersEl = document.getElementById("orders");
      const statusEl = document.getElementById("status");

      if (!API) {
        statusEl.textContent = "Staff screen is not connected.";
        return;
      }

      try {
        const response = await fetch(
          API + "?action=orders&t=" + Date.now(),
          { cache: "no-store" }
        );

        const data = await response.json();
        const orders = data.orders || [];

        if (!orders.length) {
          ordersEl.innerHTML = "";
          statusEl.textContent = "No active orders.";
          return;
        }

        statusEl.textContent = "";

        ordersEl.innerHTML = orders.map(order => {
          const items = (order.items || []).map(item => {
            const options =
              item.options && item.options.length
                ? item.options.join(" • ")
                : "Regular";

            return `
              <div class="item">
                <strong>${esc(item.quantity)} × ${esc(item.itemName)}</strong>
                <div class="options">${esc(options)}</div>
              </div>
            `;
          }).join("");

          return `
            <div class="order" id="order-${esc(order.id)}">
              <div class="number">#${esc(order.orderNumber)}</div>
              <div class="customer">${esc(order.customerName)}</div>

              ${items}

              <div class="total">€${Number(order.total).toFixed(2)}</div>

              <button
                class="complete"
                onclick="completeOrder('${esc(order.id)}')">
                COMPLETE ORDER
              </button>
            </div>
          `;
        }).join("");

      } catch (err) {
        statusEl.textContent = "Unable to load orders.";
      }
    }

    async function completeOrder(orderId) {
      if (!confirm("Mark this order complete?")) return;

      const card = document.getElementById("order-" + orderId);

      if (card) {
        card.remove();
      }

      if (!document.querySelector(".order")) {
        document.getElementById("status").textContent = "No active orders.";
      }

      try {
        await fetch(API, {
          method: "POST",
          body: JSON.stringify({
            action: "completeOrder",
            orderId: orderId
          })
        });

        setTimeout(loadOrders, 1000);

      } catch (err) {
        setTimeout(loadOrders, 1000);
      }
    }

    document.getElementById("refresh").addEventListener("click", loadOrders);

    loadOrders();
    setInterval(loadOrders, 5000);
  </script>

</body>
</html>
