<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POPPAD CAFÉ • Staff Orders</title><style>body{margin:0;padding:18px;background:#0b0b0b;color:#fff;font-family:Arial}h1{font-size:25px}.status{color:#bbb;margin-bottom:18px}.order{background:#171717;border:1px solid #555;border-radius:14px;padding:18px;margin:14px 0}.num{font-size:30px;font-weight:900}.name{font-size:21px;margin:5px 0 14px}.item{padding:10px 0;border-top:1px solid #333}.opts{color:#bbb;font-size:14px}.total{font-size:23px;font-weight:900;margin:16px 0}.complete{width:100%;padding:17px;border:0;border-radius:10px;background:#fff;color:#000;font-size:17px;font-weight:900}.refresh{padding:10px 14px;font-weight:800}</style></head><body><h1>POPPAD CAFÉ • ORDERS</h1><div id="status" class="status">Connecting…</div><button class="refresh" onclick="loadOrders()">REFRESH</button><div id="orders"></div><script src="config.js"></script><script>
const API=(window.POPPAD_ORDER_CONFIG||{}).orderApiUrl;const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function loadOrders(){const box=document.getElementById('orders'),st=document.getElementById('status');if(!API){st.textContent='Demo build — connect the POPPAD CAFÉ backend in config.js.';box.innerHTML='';return}try{const r=await fetch(API+'?action=orders&_='+Date.now());const d=await r.json();if(!d.ok)throw Error(d.error||'Unable to load');st.textContent='Auto-refreshing every 5 seconds';box.innerHTML=d.orders.length?d.orders.map(o=>`<div class="order"><div class="num">#${esc(o.orderNumber)}</div><div class="name">${esc(o.customerName)}</div>${(o.items||[]).map(i=>`<div class="item"><b>${i.quantity} × ${esc(i.itemName)}</b><div class="opts">${(i.options||[]).map(esc).join(' • ')}</div></div>`).join('')}<div class="total">€${Number(o.total).toFixed(2)}</div><button class="complete" onclick="completeOrder('${esc(o.id)}')">COMPLETE ORDER</button></div>`).join(''):'<p>No active orders.</p>'}catch(e){st.textContent='Connection error: '+e.message}}
async function completeOrder(id){if(!confirm('Mark this order complete?'))return;await fetch(API,{method:'POST',body:JSON.stringify({action:'completeOrder',orderId:id})});loadOrders()} loadOrders();setInterval(loadOrders,5000);
</script></body></html>
